# Настройки searxng-local. Файл генерируется installer'ом из этого шаблона
# со случайным secret_key.
use_default_settings: true

server:
  secret_key: "{{SECRET_KEY}}"
  bind_address: "127.0.0.1"
  port: {{PORT}}
  limiter: false

search:
  formats:
    - html
    - json

# Корпоративный прокси перехватывает HTTPS (MITM) — стандартная проверка
# сертификатов валит все движки; при наличии CA-бандла можно вернуть true
# и указать его через env SSL_CERT_FILE (см. README проекта).
outgoing:
  verify: false
{{PROXY}}
